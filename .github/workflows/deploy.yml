name: Deploy
on:
  push:
    branches: [main]
  # Fired by the product repo's release workflow (same dispatch that redeploys
  # the marketing site's /changelog), plus an optional docs-only signal, so a
  # release or a docs edit upstream redeploys these docs. repository_dispatch
  # and schedule always run on the default branch → github.ref_name is "main".
  repository_dispatch:
    types: [product-release, docs-source-changed]
  # Docs change more often than releases tag — a daily rebuild picks up
  # between-release edits to the product repo's /docs with zero coupling.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ${{ github.ref_name }}
    environment: ${{ github.ref_name }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # The product commit the docs will be pulled at. Passed to the build as
      # DOCS_SOURCE_SHA so a product change invalidates the cached `pnpm build`
      # layer (see the Dockerfile); fails rather than building on an empty
      # value, which would silently bring the stale cache back.
      - name: Resolve product docs commit
        id: source
        run: |
          sha="$(git ls-remote https://github.com/openlinker-project/openlinker.git refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build . --tag openlinker-docs:${{ github.ref_name }} -f Dockerfile --build-arg "SITE_URL=${{ vars.SITE_URL }}" --build-arg "PUBLIC_GA_MEASUREMENT_ID=${{ vars.PUBLIC_GA_MEASUREMENT_ID }}" --build-arg "DOCS_SOURCE_SHA=${{ steps.source.outputs.sha }}"

      - name: Run Docker image
        working-directory: ${{ secrets.PROJECT_DIR }}
        env:
          TAG: ${{ github.ref_name }}
        run: docker compose up -d
