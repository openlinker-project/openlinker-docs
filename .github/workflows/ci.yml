name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pulls the allowlisted docs from the product repo, then typechecks and
      # builds the static site. Fails if zero docs are fetched.
      - run: pnpm sync
      - run: pnpm typecheck
      - run: pnpm build
