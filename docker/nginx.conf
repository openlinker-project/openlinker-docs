server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS terminates at the shared reverse proxy, so nginx sees plain http and
  # would build absolute redirects as http://… (e.g. the directory-slash
  # redirect /foo -> http://docs.openlinker.io/foo/), adding a second hop back
  # to https. Relative Location headers keep the client on its own scheme.
  absolute_redirect off;

  # Docs are English-only at the root; the marketing site's /en/ prefix leaks
  # into cross-site links. A real 301 (not a 200 meta-refresh page) so search
  # engines consolidate onto the root URL. See astro.config.mjs.
  location = /en { return 301 /; }
  location ^~ /en/ {
    rewrite ^/en/(.*)$ /$1 permanent;
  }

  # Starlight emits a directory per route (/foo/index.html) plus a 404.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;

  # Fingerprinted assets are immutable; HTML must stay fresh.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /pagefind/pagefind.js {
    add_header Cache-Control "public, max-age=3600";
  }

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
}
