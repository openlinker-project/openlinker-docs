server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Starlight emits a directory per route (/foo/index.html) plus a 404.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;

  # Fingerprinted assets are immutable; HTML must stay fresh.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /pagefind/pagefind.js {
    add_header Cache-Control "public, max-age=3600";
  }

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
}
