<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenLinker">
  <title>OpenLinker</title>
  <!-- Transparent mono-black variant. Use on light surfaces.
       Source: openlinker-avatar-mono-black.svg, background rect removed,
       stroke + fill switched from #ffffff to #000000 so the mark renders
       on light canvas. -->

  <g transform="translate(250 250) rotate(-30)">
    <rect x="-72" y="-160" width="144" height="320" rx="72" ry="72"
          fill="none" stroke="#000000" stroke-width="42"/>
  </g>
  <rect x="105" y="232" width="290" height="36" rx="18" fill="#000000"/>
</svg>
